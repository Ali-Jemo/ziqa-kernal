# Bootimage configuration for ZiqaKernel
# Used by the bootimage tool to create bootable kernel images

[bootimage]
# Path to the binary to package as a boot image
binary = "ziqa-kernel"

# The runner command for executing the boot image with QEMU
# This matches the run-command in Cargo.toml's [package.metadata.bootimage]
runner = ["qemu-system-x86_64", "-drive", "format=raw,file={bootimage}", "-serial", "stdio", "-display", "none"]

# Target architecture
target = "x86_64-unknown-none"