<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="q0g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#e55a75"/>
    </linearGradient>
    <linearGradient id="q1g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0af68"/>
      <stop offset="100%" stop-color="#d49a4a"/>
    </linearGradient>
    <linearGradient id="q2g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#5d8fe8"/>
    </linearGradient>
    <linearGradient id="q3g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#7db84d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#565f89"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="url(#bg)" rx="12"/>
  <text x="350" y="30" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">MLFQ Scheduler — Priority Queues</text>

  <!-- Queue 0 (highest priority) -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="600" height="55" rx="6" fill="url(#q0g)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="70" height="55" rx="6" fill="#1a1b26" opacity="0.3"/>
    <text x="35" y="24" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Q0</text>
    <text x="35" y="41" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">5ms</text>
    <text x="100" y="24" fill="#1a1b26" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Highest Priority</text>
    <text x="100" y="42" fill="#1a1b26" font-size="10" font-family="system-ui, -apple-system, sans-serif">Interactive processes, short bursts</text>
    <g transform="translate(400, 10)">
      <rect x="0" y="0" width="36" height="34" rx="4" fill="#1a1b26" opacity="0.2"/>
      <text x="18" y="22" text-anchor="middle" fill="#c0caf5" font-size="10" font-family="monospace">P1</text>
    </g>
    <g transform="translate(445, 10)">
      <rect x="0" y="0" width="36" height="34" rx="4" fill="#1a1b26" opacity="0.2"/>
      <text x="18" y="22" text-anchor="middle" fill="#c0caf5" font-size="10" font-family="monospace">P2</text>
    </g>
    <g transform="translate(490, 10)">
      <rect x="0" y="0" width="36" height="34" rx="4" fill="#1a1b26" opacity="0.2"/>
      <text x="18" y="22" text-anchor="middle" fill="#c0caf5" font-size="10" font-family="monospace">P3</text>
    </g>
  </g>

  <!-- Queue 1 -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="600" height="55" rx="6" fill="url(#q1g)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="70" height="55" rx="6" fill="#1a1b26" opacity="0.3"/>
    <text x="35" y="24" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Q1</text>
    <text x="35" y="41" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">10ms</text>
    <text x="100" y="24" fill="#1a1b26" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Medium-High</text>
    <text x="100" y="42" fill="#1a1b26" font-size="10" font-family="system-ui, -apple-system, sans-serif">CPU-bound short, interactive fallback</text>
  </g>

  <!-- Queue 2 -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="600" height="55" rx="6" fill="url(#q2g)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="70" height="55" rx="6" fill="#1a1b26" opacity="0.3"/>
    <text x="35" y="24" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Q2</text>
    <text x="35" y="41" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">25ms</text>
    <text x="100" y="24" fill="#1a1b26" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Medium</text>
    <text x="100" y="42" fill="#1a1b26" font-size="10" font-family="system-ui, -apple-system, sans-serif">Background tasks, batch processing</text>
  </g>

  <!-- Queue 3 (lowest priority) -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="600" height="55" rx="6" fill="url(#q3g)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="70" height="55" rx="6" fill="#1a1b26" opacity="0.3"/>
    <text x="35" y="24" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Q3</text>
    <text x="35" y="41" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">50ms</text>
    <text x="100" y="24" fill="#1a1b26" font-size="13" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Lowest Priority</text>
    <text x="100" y="42" fill="#1a1b26" font-size="10" font-family="system-ui, -apple-system, sans-serif">Long-running CPU-heavy workloads</text>
  </g>

  <!-- Priority boost arrow -->
  <g transform="translate(580, 270)">
    <path d="M 50 20 Q 50 -20 20 -40" stroke="#2ac3de" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="75" y="-15" fill="#2ac3de" font-size="9" font-family="system-ui, -apple-system, sans-serif">Priority boost every 100ms</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 345)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#f7768e"/>
    <text x="18" y="10" fill="#565f89" font-size="10" font-family="system-ui, -apple-system, sans-serif">Q0 (highest, RR 5ms)</text>
    <rect x="140" y="0" width="12" height="12" rx="2" fill="#e0af68"/>
    <text x="158" y="10" fill="#565f89" font-size="10" font-family="system-ui, -apple-system, sans-serif">Q1 (RR 10ms)</text>
    <rect x="280" y="0" width="12" height="12" rx="2" fill="#7aa2f7"/>
    <text x="298" y="10" fill="#565f89" font-size="10" font-family="system-ui, -apple-system, sans-serif">Q2 (RR 25ms)</text>
    <rect x="420" y="0" width="12" height="12" rx="2" fill="#9ece6a"/>
    <text x="438" y="10" fill="#565f89" font-size="10" font-family="system-ui, -apple-system, sans-serif">Q3 (FIFO 50ms)</text>
  </g>
</svg>
