      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7" />
    </marker>
  </defs>
  <rect x="50" y="50" width="120" height="150" rx="10" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
