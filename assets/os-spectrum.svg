<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="g-linux" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#16161e"/>
  
  <text x="400" y="40" text-anchor="middle" fill="#c0caf5" font-size="20" font-family="monospace">KERNEL ARCHITECTURE SPECTRUM</text>

  <!-- Axis -->
  <line x1="50" y1="300" x2="750" y2="300" stroke="#565f89" stroke-width="2"/>
  <text x="50" y="330" fill="#565f89" font-size="12">Monolithic (Hardened/Complex)</text>
  <text x="750" y="330" text-anchor="end" fill="#565f89" font-size="12">Experimental/Modular</text>

  <!-- Nodes -->
  <circle cx="100" cy="300" r="10" fill="#f7768e"/>
  <text x="100" y="270" text-anchor="middle" fill="#f7768e" font-size="14">Linux</text>

  <circle cx="250" cy="300" r="10" fill="#e0af68"/>
  <text x="250" y="270" text-anchor="middle" fill="#e0af68" font-size="14">Windows NT</text>

  <circle cx="400" cy="300" r="10" fill="#bb9af7"/>
  <text x="400" y="270" text-anchor="middle" fill="#bb9af7" font-size="14">macOS (XNU)</text>

  <circle cx="650" cy="300" r="15" fill="#2ac3de" stroke="white" stroke-width="2"/>
  <text x="650" y="260" text-anchor="middle" fill="#2ac3de" font-size="16" font-weight="bold">ZiqaKernel</text>
  
  <!-- Indicator line -->
  <line x1="650" y1="285" x2="650" y2="200" stroke="#2ac3de" stroke-width="2" stroke-dasharray="4"/>
  <text x="650" y="190" text-anchor="middle" fill="#2ac3de" font-size="14">Research Sandbox</text>
</svg>