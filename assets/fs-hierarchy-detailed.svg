<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>

    <linearGradient id="vfsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#5d8fe8"/>
    </linearGradient>
    <linearGradient id="ramg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#7db84d"/>
    </linearGradient>
    <linearGradient id="ziqag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0af68"/>
      <stop offset="100%" stop-color="#d49a4a"/>
    </linearGradient>
    <linearGradient id="fatg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#e55a75"/>
    </linearGradient>
    <linearGradient id="devg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ac3de"/>
      <stop offset="100%" stop-color="#1fb0cc"/>
    </linearGradient>
    <linearGradient id="procg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#a57de6"/>
    </linearGradient>
    <linearGradient id="pageg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73daca"/>
      <stop offset="100%" stop-color="#41a6b6"/>
    </linearGradient>
    <linearGradient id="blockg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#565f89"/>
      <stop offset="100%" stop-color="#3b4261"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#565f89"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#bg)" rx="12"/>
  <text x="500" y="30" text-anchor="middle" fill="#c0caf5" font-size="20" font-weight="bold">Filesystem Stack — VFS, Mounts, Backends</text>
  <text x="500" y="50" text-anchor="middle" fill="#565f89" font-size="11" font-family="monospace">capability-gated path resolution → VFS tree → mount table → backend FS → page cache → block device</text>

  <!-- Layer 1: VFS root tree -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="920" height="180" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="920" height="26" rx="10" fill="url(#vfsg)"/>
    <text x="460" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">Layer 1 — VFS root tree (BTreeMap&lt;String, VfsNode&gt;)</text>

    <!-- Root node -->
    <g transform="translate(440, 38)">
      <rect x="0" y="0" width="60" height="40" rx="20" fill="url(#vfsg)" filter="url(#shadow)"/>
      <text x="30" y="25" text-anchor="middle" fill="#1a1b26" font-size="14" font-weight="bold" font-family="monospace">/</text>
    </g>

    <!-- Tree branches -->
    <line x1="470" y1="78" x2="470" y2="100" stroke="#3b4261" stroke-width="2"/>
    <line x1="80"  y1="100" x2="860" y2="100" stroke="#3b4261" stroke-width="2"/>
    <line x1="80"  y1="100" x2="80"  y2="120" stroke="#2ac3de" stroke-width="2"/>
    <line x1="240" y1="100" x2="240" y2="120" stroke="#9ece6a" stroke-width="2"/>
    <line x1="400" y1="100" x2="400" y2="120" stroke="#e0af68" stroke-width="2"/>
    <line x1="560" y1="100" x2="560" y2="120" stroke="#f7768e" stroke-width="2"/>
    <line x1="720" y1="100" x2="720" y2="120" stroke="#bb9af7" stroke-width="2"/>
    <line x1="860" y1="100" x2="860" y2="120" stroke="#73daca" stroke-width="2"/>

    <!-- /dev -->
    <g transform="translate(40, 120)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="url(#devg)" filter="url(#shadow)"/>
      <text x="40" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">/dev</text>
      <text x="40" y="33" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">devices</text>
    </g>
    <!-- /etc -->
    <g transform="translate(200, 120)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="url(#ramg)" filter="url(#shadow)"/>
      <text x="40" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">/etc</text>
      <text x="40" y="33" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">motd</text>
    </g>
    <!-- /bin -->
    <g transform="translate(360, 120)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="url(#ramg)" filter="url(#shadow)"/>
      <text x="40" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">/bin</text>
      <text x="40" y="33" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">ELFs</text>
    </g>
    <!-- /disk -->
    <g transform="translate(520, 120)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="url(#ziqag)" filter="url(#shadow)"/>
      <text x="40" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">/disk</text>
      <text x="40" y="33" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">ZiqaFS</text>
    </g>
    <!-- /fat -->
    <g transform="translate(680, 120)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="url(#fatg)" filter="url(#shadow)"/>
      <text x="40" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">/fat</text>
      <text x="40" y="33" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">FAT32</text>
    </g>
    <!-- /proc -->
    <g transform="translate(820, 120)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="url(#procg)" filter="url(#shadow)"/>
      <text x="40" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">/proc</text>
      <text x="40" y="33" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">planned</text>
    </g>
  </g>

  <!-- Layer 2: Mount table -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="920" height="92" rx="10" fill="#24283b" stroke="#bb9af7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="920" height="26" rx="10" fill="url(#procg)"/>
    <text x="460" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">Layer 2 — Mount table (longest-prefix dispatch)</text>

    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="280" height="44" rx="6" fill="#1f2335" stroke="#9ece6a" stroke-width="1"/>
      <text x="10" y="16" fill="#c0caf5" font-size="9" font-family="monospace">/etc/motd           →  RamFile</text>
      <text x="10" y="32" fill="#c0caf5" font-size="9" font-family="monospace">/bin/test           →  RamFile(ELF)</text>
    </g>
    <g transform="translate(310, 36)">
      <rect x="0" y="0" width="280" height="44" rx="6" fill="#1f2335" stroke="#9ece6a" stroke-width="1"/>
      <text x="10" y="16" fill="#c0caf5" font-size="9" font-family="monospace">/bin/busybox        →  RamFile(ELF)</text>
      <text x="10" y="32" fill="#c0caf5" font-size="9" font-family="monospace">/bin/hello.wasm     →  RamFile</text>
    </g>
    <g transform="translate(600, 36)">
      <rect x="0" y="0" width="300" height="44" rx="6" fill="#1f2335" stroke="#e0af68" stroke-width="1"/>
      <text x="10" y="16" fill="#c0caf5" font-size="9" font-family="monospace">/disk               →  ZiqaFS  (custom journaling)</text>
      <text x="10" y="32" fill="#c0caf5" font-size="9" font-family="monospace">/fat                →  FAT32   (host-editable)</text>
    </g>
  </g>

  <!-- Layer 3: File trait backends -->
  <g transform="translate(40, 377)">
    <rect x="0" y="0" width="920" height="135" rx="10" fill="#24283b" stroke="#9ece6a" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="920" height="26" rx="10" fill="url(#ramg)"/>
    <text x="460" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">Layer 3 — File trait implementations (impl File for &lt;backend&gt;)</text>

    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="200" height="84" rx="6" fill="url(#ramg)" opacity="0.3" stroke="#9ece6a" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" fill="#9ece6a" font-size="12" font-weight="bold" font-family="monospace">RamFile</text>
      <text x="100" y="38" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">Vec&lt;u8&gt; in heap</text>
      <text x="100" y="54" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">read / write / size</text>
      <text x="100" y="70" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">no truncate</text>
    </g>

    <g transform="translate(240, 36)">
      <rect x="0" y="0" width="200" height="84" rx="6" fill="url(#ziqag)" opacity="0.3" stroke="#e0af68" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" fill="#e0af68" font-size="12" font-weight="bold" font-family="monospace">ZiqaFS</text>
      <text x="100" y="38" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">custom journaling</text>
      <text x="100" y="54" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">format() / mount()</text>
      <text x="100" y="70" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">block_io backend</text>
    </g>

    <g transform="translate(460, 36)">
      <rect x="0" y="0" width="200" height="84" rx="6" fill="url(#fatg)" opacity="0.3" stroke="#f7768e" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" fill="#f7768e" font-size="12" font-weight="bold" font-family="monospace">FAT32</text>
      <text x="100" y="38" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">find_fat32_partition</text>
      <text x="100" y="54" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">pure-Rust driver</text>
      <text x="100" y="70" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">R/W + dir create</text>
    </g>

    <g transform="translate(680, 36)">
      <rect x="0" y="0" width="220" height="84" rx="6" fill="url(#devg)" opacity="0.3" stroke="#2ac3de" stroke-width="1"/>
      <text x="110" y="20" text-anchor="middle" fill="#2ac3de" font-size="12" font-weight="bold" font-family="monospace">DeviceNode</text>
      <text x="110" y="38" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">/dev/uart, /dev/fb</text>
      <text x="110" y="54" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">/dev/drm, /dev/kbd</text>
      <text x="110" y="70" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">DRM/KMS device caps</text>
    </g>
  </g>

  <!-- Layer 4: Page cache + block device -->
  <g transform="translate(40, 527)">
    <rect x="0" y="0" width="920" height="138" rx="10" fill="#24283b" stroke="#73daca" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="920" height="26" rx="10" fill="url(#pageg)"/>
    <text x="460" y="18" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold">Layer 4 — Page cache + block-device backends</text>

    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="200" height="84" rx="6" fill="url(#pageg)" opacity="0.3" stroke="#73daca" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" fill="#73daca" font-size="12" font-weight="bold" font-family="monospace">pagecache</text>
      <text x="100" y="38" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">LRU 4 KiB pages</text>
      <text x="100" y="54" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">read-ahead / write-back</text>
      <text x="100" y="70" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">sits above block_io</text>
    </g>

    <g transform="translate(240, 36)">
      <rect x="0" y="0" width="440" height="84" rx="6" fill="url(#blockg)" stroke="#3b4261" stroke-width="1"/>
      <text x="220" y="20" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="bold" font-family="monospace">block_registry  ·  BlockDevice trait</text>
      <text x="220" y="40" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">drivers::ata::register()      →  ATA PIO   (legacy disk)</text>
      <text x="220" y="56" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">drivers::virtio_block::register()   →  VirtIO MMIO</text>
      <text x="220" y="72" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">drivers::virtio_block_new::register()   →  new-driver variant</text>
    </g>

    <g transform="translate(700, 36)">
      <rect x="0" y="0" width="200" height="84" rx="6" fill="#1f2335" stroke="#7aa2f7" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" fill="#7aa2f7" font-size="12" font-weight="bold" font-family="monospace">disk.img (QEMU)</text>
      <text x="100" y="38" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">64 MiB raw image</text>
      <text x="100" y="54" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">VirtIO block backend</text>
      <text x="100" y="70" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">bootimage / qemu</text>
    </g>
  </g>

  <!-- Down-arrows between layers -->
  <line x1="500" y1="255" x2="500" y2="270" stroke="#565f89" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="362" x2="500" y2="377" stroke="#565f89" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="512" x2="500" y2="527" stroke="#565f89" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Side note: capability check -->
  <g transform="translate(770, 75)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#24283b" stroke="#f7768e" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="180" height="22" rx="8" fill="url(#fatg)"/>
    <text x="90" y="16" text-anchor="middle" fill="#1a1b26" font-size="10" font-weight="bold">Capability check</text>
    <line x1="10" y1="28" x2="170" y2="28" stroke="#3b4261" stroke-width="1"/>
    <text x="10" y="46" fill="#c0caf5" font-size="9" font-family="monospace">every open/read/write</text>
    <text x="10" y="60" fill="#c0caf5" font-size="9" font-family="monospace">gated by ResourceKind::File</text>
    <text x="10" y="74" fill="#c0caf5" font-size="9" font-family="monospace">in process.capabilities</text>
    <text x="10" y="96" fill="#e0af68" font-size="9" font-weight="bold" font-family="monospace">grant/deny at mount:</text>
    <text x="10" y="110" fill="#c0caf5" font-size="9" font-family="monospace">p.capabilities.grant(</text>
    <text x="10" y="124" fill="#c0caf5" font-size="9" font-family="monospace">  ResourceKind::File,</text>
    <text x="10" y="138" fill="#c0caf5" font-size="9" font-family="monospace">  Permissions::full(),</text>
    <text x="10" y="152" fill="#c0caf5" font-size="9" font-family="monospace">  target,</text>
    <text x="10" y="166" fill="#c0caf5" font-size="9" font-family="monospace">  parent_id=None,</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 678)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#7aa2f7"/>
    <text x="18" y="10" fill="#565f89" font-size="10" font-family="monospace">VFS</text>
    <rect x="80" y="0" width="12" height="12" rx="2" fill="#9ece6a"/>
    <text x="98" y="10" fill="#565f89" font-size="10" font-family="monospace">RamFS</text>
    <rect x="170" y="0" width="12" height="12" rx="2" fill="#e0af68"/>
    <text x="188" y="10" fill="#565f89" font-size="10" font-family="monospace">ZiqaFS</text>
    <rect x="270" y="0" width="12" height="12" rx="2" fill="#f7768e"/>
    <text x="288" y="10" fill="#565f89" font-size="10" font-family="monospace">FAT32</text>
    <rect x="360" y="0" width="12" height="12" rx="2" fill="#2ac3de"/>
    <text x="378" y="10" fill="#565f89" font-size="10" font-family="monospace">devices</text>
    <rect x="460" y="0" width="12" height="12" rx="2" fill="#bb9af7"/>
    <text x="478" y="10" fill="#565f89" font-size="10" font-family="monospace">mount table</text>
    <rect x="580" y="0" width="12" height="12" rx="2" fill="#73daca"/>
    <text x="598" y="10" fill="#565f89" font-size="10" font-family="monospace">page cache + block_io</text>
  </g>
</svg>
