<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#2ac3de"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#16161e" rx="40"/>

  <!-- Geometric Hex Structure -->
  <path d="M200 60 L350 146 L350 254 L200 340 L50 254 L50 146 Z" 
    fill="none" stroke="url(#g1)" stroke-width="6" opacity="0.8" filter="url(#f1)"/>

  <!-- Inner Circuitry -->
  <path d="M200 100 L200 300 M100 150 L300 250 M300 150 L100 250" 
    stroke="#3b4261" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Logo Character Z -->
  <text x="200" y="215" text-anchor="middle" dominant-baseline="middle"
    fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
    font-size="160" font-weight="900" font-family="monospace">Z</text>

  <!-- Project Name -->
  <text x="200" y="370" text-anchor="middle" fill="#c0caf5" font-size="24"
    font-family="system-ui, sans-serif" font-weight="bold" letter-spacing="8">ZIQAKERNEL</text>
</svg>