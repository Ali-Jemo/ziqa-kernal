<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="750" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="userg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#5d8fe8"/>
    </linearGradient>
    <linearGradient id="kernelg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#e55a75"/>
    </linearGradient>
    <linearGradient id="heapp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0af68"/>
      <stop offset="100%" stop-color="#d49a4a"/>
    </linearGradient>
    <linearGradient id="stackg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#7db84d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="750" height="400" fill="url(#bg)" rx="12"/>
  <text x="375" y="30" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Memory Layout</text>

  <!-- Two-column layout -->
  <!-- Kernel Space -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="300" height="310" rx="8" fill="#24283b" stroke="#f7768e" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="36" rx="8" fill="url(#kernelg)"/>
    <text x="150" y="23" text-anchor="middle" fill="#1a1b26" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Kernel Space</text>

    <!-- Addr label -->
    <text x="150" y="-5" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">0xFFFF_8000_0000_0000 – 0xFFFF_FFFF_FFFF_FFFF</text>

    <!-- Regions -->
    <rect x="15" y="50" width="270" height="35" rx="4" fill="url(#heapp)" opacity="0.8"/>
    <text x="150" y="65" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Kernel Heap</text>
    <text x="150" y="80" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">8 MiB linked_list_allocator</text>

    <rect x="15" y="95" width="270" height="35" rx="4" fill="url(#stackg)" opacity="0.8"/>
    <text x="150" y="110" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Physical Memory Map</text>
    <text x="150" y="125" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">boot_info.map_physical_memory()</text>

    <rect x="15" y="140" width="270" height="35" rx="4" fill="#565f89"/>
    <text x="150" y="155" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Page Tables</text>
    <text x="150" y="170" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">PML4 → PDPT → PD → PT</text>

    <rect x="15" y="185" width="270" height="35" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>
    <text x="150" y="200" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Kernel Code + Data</text>
    <text x="150" y="215" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">GDT · IDT · TSS · IST stacks</text>

    <rect x="15" y="230" width="270" height="35" rx="4" fill="#3b4261"/>
    <text x="150" y="245" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Frame Allocator</text>
    <text x="150" y="260" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">BootInfoFrameAllocator</text>

    <rect x="15" y="275" width="270" height="25" rx="4" fill="url(#kernelg)" opacity="0.2" stroke="#f7768e" stroke-width="1"/>
    <text x="150" y="292" text-anchor="middle" fill="#f7768e" font-size="9" font-family="system-ui, -apple-system, sans-serif">Higher-half boundary: 0xFFFF_8000_0000_0000</text>
  </g>

  <!-- Userspace -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="300" height="310" rx="8" fill="#24283b" stroke="#7aa2f7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="300" height="36" rx="8" fill="url(#userg)"/>
    <text x="150" y="23" text-anchor="middle" fill="#1a1b26" font-size="14" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Userspace</text>

    <text x="150" y="-5" text-anchor="middle" fill="#565f89" font-size="9" font-family="monospace">0x0000_0000_0000_0000 – 0xFFFF_7FFF_FFFF_FFFF</text>

    <rect x="15" y="50" width="270" height="30" rx="4" fill="url(#stackg)" opacity="0.8"/>
    <text x="150" y="65" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Stack (grows down)</text>
    <text x="150" y="78" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">~128 KB default</text>

    <rect x="15" y="90" width="270" height="20" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>

    <rect x="15" y="120" width="270" height="30" rx="4" fill="url(#heapp)" opacity="0.8"/>
    <text x="150" y="135" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Heap / brk</text>
    <text x="150" y="148" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">Program break via sbrk/brk</text>

    <rect x="15" y="160" width="270" height="20" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>

    <rect x="15" y="190" width="270" height="30" rx="4" fill="#565f89"/>
    <text x="150" y="205" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Data / BSS</text>
    <text x="150" y="218" text-anchor="middle" fill="#c0caf5" font-size="9" font-family="monospace">Initialized + zero-initialized</text>

    <rect x="15" y="230" width="270" height="20" rx="4" fill="#24283b" stroke="#3b4261" stroke-width="1"/>

    <rect x="15" y="260" width="270" height="30" rx="4" fill="url(#userg)" opacity="0.4"/>
    <text x="150" y="275" text-anchor="middle" fill="#1a1b26" font-size="11" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">Text (code)</text>
    <text x="150" y="288" text-anchor="middle" fill="#1a1b26" font-size="9" font-family="monospace">Read-only, executable</text>

    <rect x="15" y="295" width="270" height="8" rx="2" fill="#f7768e" opacity="0.3"/>
    <text x="150" y="306" text-anchor="middle" fill="#f7768e" font-size="8" font-family="system-ui, -apple-system, sans-serif">null page trap</text>
  </g>
</svg>
