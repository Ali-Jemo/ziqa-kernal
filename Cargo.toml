[package]
name = "ziqa-kernel"
version = "0.1.0"
edition = "2021"

[features]
default = ["full"]
full = ["shell", "vfs", "ziqafs", "fat32", "net", "ebpf", "drm", "games", "wasm", "zig-hotpaths"]
fast-dev = ["shell", "vfs"]
shell = ["vfs"]
vfs = []
ziqafs = ["vfs"]
fat32 = ["vfs"]
net = ["dep:smoltcp"]
ebpf = []
drm = []
games = []
wasm = []
zig-hotpaths = []
userspace-drivers-test = []
perf-benchmarks = []
orbital = ["shell", "vfs", "fat32"]
embed-orbital = ["orbital"]
busybox = []
skip-self-tests = []
diagnostic-demo-client = []
redox-debug = []

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"], optional = true }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = { version = "0.10.6", features = ["use_spin"] }
pc-keyboard = { version = "0.7.0", optional = true }
pic8259 = { version = "0.10.1", optional = true }
spin = "0.9.8"
uart_16550 = { version = "0.3.0", optional = true }
volatile = "0.2.7"
x86_64 = { version = "0.14.12", features = ["nightly", "instructions"], optional = true }
smoltcp = { version = "0.11", optional = true, default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-dns", "socket-dhcpv4", "alloc"] }
pci_types = "0.10"
acpi = { version = "4.0", default-features = false }
virtio-drivers = { version = "0.7.1", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.11.6", default-features = false }
libm = { version = "0.2.16", default-features = false }
rmm = { path = "third_party/rmm" }
bitflags = "2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
pc-keyboard = { version = "0.7.0" }
pic8259 = { version = "0.10.1" }
uart_16550 = { version = "0.3.0" }
x86_64 = { version = "0.14.12", features = ["nightly", "instructions"] }

[profile.dev]
opt-level = 0
panic = "abort"
codegen-units = 16

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={bootimage}", "-drive", "file=disk.img,if=none,format=raw,id=hdr0", "-device", "virtio-blk-pci,drive=hdr0", "-serial", "stdio", "-display", "none", "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0"]

[package.metadata.bootloader]
physical-memory-offset = "0xFFFF800000000000"
