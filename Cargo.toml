cargo-features = ["profile-rustflags"]

[package]
name = "ziqa-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = { version = "0.10.6", features = ["use_spin"] }
pc-keyboard = "0.7.0"
pic8259 = "0.10.1"
spin = "0.9.8"
uart_16550 = "0.3.0"
volatile = "0.2.7"
x86_64 = { version = "0.14.12", features = ["nightly", "instructions"] }

[profile.dev]
opt-level = 1
panic = "abort"
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
panic = "abort"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={bootimage}", "-serial", "stdio", "-display", "none"]
