
[package]
name = "ziqa-kernel"
version = "0.1.0"
edition = "2021"

[features]
default = ["full"]
full = ["shell", "vfs", "ziqafs", "fat32", "net", "ebpf", "drm", "games", "wasm", "zig-hotpaths"]
fast-dev = ["shell", "vfs"]
shell = ["vfs"]
vfs = []
ziqafs = ["vfs"]
fat32 = ["vfs"]
fatfs-crate = ["dep:fatfs"]
net = ["dep:smoltcp"]
ebpf = []
drm = []
games = []
wasm = []
zig-hotpaths = []
userspace-drivers-test = []
perf-benchmarks = []

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = { version = "0.10.6", features = ["use_spin"] }
pc-keyboard = "0.7.0"
pic8259 = "0.10.1"
spin = "0.9.8"
uart_16550 = "0.3.0"
volatile = "0.2.7"
embedded-cli = "0.2.1"
x86_64 = { version = "0.14.12", features = ["nightly", "instructions"] }
smoltcp = { version = "0.11", optional = true, default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp", "socket-dns", "socket-dhcpv4", "alloc"] }
pci_types = "0.10"
acpi = { version = "4.0", default-features = false }
fatfs = { version = "0.3.6", optional = true, default-features = false, features = ["alloc", "core_io"] }
virtio-drivers = { version = "0.7.1", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.11.6", default-features = false }
libm = { version = "0.2.16", default-features = false }



[profile.dev]
opt-level = 1
panic = "abort"
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
panic = "abort"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={bootimage}", "-drive", "file=disk.img,if=none,format=raw,id=hdr0", "-device", "virtio-blk-pci,drive=hdr0", "-serial", "stdio", "-display", "none", "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0"]
